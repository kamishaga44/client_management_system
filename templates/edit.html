
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование клиента</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Редактирование клиента</h1>
            <p>Изменение данных в клиентской базе</p>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Клиент №{{ client.id }}</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p class="message {{ category }}">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('edit_client', client_id=client.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="name">Имя</label>
                <input id="name" name="name" type="text"
                       maxlength="100" required value="{{ client.name }}">

                <label for="email">Электронная почта</label>
                <input id="email" name="email" type="email"
                       maxlength="120" required value="{{ client.email }}">

                <label for="phone">Телефон</label>
                <input id="phone" name="phone" type="tel"
                       maxlength="30" required value="{{ client.phone }}">

                <button type="submit">Сохранить изменения</button>
            </form>

            <p>
                <a href="{{ url_for('index') }}">← Вернуться к списку клиентов</a>
            </p>
        </section>
    </main>
</body>
</html>
